version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: bodegia_postgres
    restart: always
    environment:
      POSTGRES_DB: bodeg-ia
      POSTGRES_USER: bdg
      POSTGRES_PASSWORD: bodegia-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdg -d bodeg-ia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
