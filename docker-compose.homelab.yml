name: bodegia-homelab

services:
  # Servidor Backend API REST
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bodegia_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://bdg:bodegia-db@192.168.1.49:5432/bodeg-ia?schema=public
      - JWT_SECRET=bodegia_super_secret_jwt_key_2026_x89a
      - JWT_EXPIRES_IN=1d
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Servidor Frontend SPA (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bodegia_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
